<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Enrollment Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>WELCOME!</h1>
            <p class="subtitle">HELLO (admin name)</p>
        </header>

        <div class="main-content">
            <!-- Search Bar -->
            <div class="search-section">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="⌕ Search courses by name or description..."
                >
                <button id="resetBtn" class="btn btn-secondary">Reset</button>
            </div>

            <!-- Add New Course Section -->
            <section class="add-course-section">
                <h2>+ Add New Course</h2>
                <form id="courseForm" class="form-group">
                    <div class="form-row">
                        <input 
                            type="text" 
                            id="courseName" 
                            placeholder="Course Name" 
                            required
                            class="form-input"
                        >
                        <input 
                            type="number" 
                            id="courseCredits" 
                            placeholder="Credits" 
                            min="0"
                            class="form-input"
                        >
                    </div>
                    <textarea 
                        id="courseDescription" 
                        placeholder="Description (optional)" 
                        rows="2"
                        class="form-input"
                    ></textarea>
                    <button type="submit" class="btn btn-primary">Add Course</button>
                </form>
            </section>

            <!-- Courses List -->
            <section class="courses-section">
                <h2>Courses & Subjects</h2>
                <div id="coursesList" class="courses-list">
                    <p class="loading">Loading courses...</p>
                </div>
            </section>
        </div>
    </div>

    <!-- Modal for Adding Subject -->
    <div id="subjectModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Subject to Course</h2>
                <button class="close-btn" onclick="closeSubjectModal()">&times;</button>
            </div>
            <form id="subjectForm" class="form-group">
                <input 
                    type="text" 
                    id="subjectName" 
                    placeholder="Subject Name" 
                    required
                    class="form-input"
                >
                <input 
                    type="text" 
                    id="subjectCode" 
                    placeholder="Subject Code (optional)" 
                    class="form-input"
                >
                <textarea 
                    id="subjectDescription" 
                    placeholder="Description (optional)" 
                    rows="2"
                    class="form-input"
                ></textarea>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Add Subject</button>
                    <button type="button" class="btn btn-secondary" onclick="closeSubjectModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Editing Course -->
    <div id="editCourseModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Course</h2>
                <button class="close-btn" onclick="closeEditCourseModal()">&times;</button>
            </div>
            <form id="editCourseForm" class="form-group">
                <input 
                    type="text" 
                    id="editCourseName" 
                    placeholder="Course Name" 
                    required
                    class="form-input"
                >
                <input 
                    type="number" 
                    id="editCourseCredits" 
                    placeholder="Credits" 
                    min="0"
                    class="form-input"
                >
                <textarea 
                    id="editCourseDescription" 
                    placeholder="Description (optional)" 
                    rows="2"
                    class="form-input"
                ></textarea>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Update Course</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditCourseModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Editing Subject -->
    <div id="editSubjectModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Subject</h2>
                <button class="close-btn" onclick="closeEditSubjectModal()">&times;</button>
            </div>
            <form id="editSubjectForm" class="form-group">
                <input 
                    type="text" 
                    id="editSubjectName" 
                    placeholder="Subject Name" 
                    required
                    class="form-input"
                >
                <input 
                    type="text" 
                    id="editSubjectCode" 
                    placeholder="Subject Code (optional)" 
                    class="form-input"
                >
                <textarea 
                    id="editSubjectDescription" 
                    placeholder="Description (optional)" 
                    rows="2"
                    class="form-input"
                ></textarea>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Update Subject</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditSubjectModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
