<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced CSS Gallery</title>

<style>

/* ===== GLOBAL STYLES ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#111;
    color:white;
    min-height:100vh;

    /* FLEXBOX CENTERING */
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* ===== HEADER ===== */

header{
    text-align:center;
    padding:30px;
}

header h1{
    font-size:2.5rem;
    letter-spacing:2px;
}

header p{
    color:#aaa;
}

/* ===== GALLERY USING GRID ===== */

.gallery{
    width:90%;
    max-width:1200px;

    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
    gap:15px;
    padding-bottom:40px;
}

.gallery img{
    width:100%;
    height:200px;
    object-fit:cover;

    border-radius:10px;
    cursor:pointer;

    transition:0.4s;
}

.gallery img:hover{
    transform:scale(1.05);
    filter:brightness(1.2);
}

/* ===== LIGHTBOX ===== */

.lightbox{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.9);

    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:1000;
}

.lightbox img{
    max-width:90%;
    max-height:80%;
    border-radius:10px;
}

/* ===== BUTTONS (FLEXBOX) ===== */

.controls{
    margin-top:20px;

    display:flex;
    gap:20px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:5px;

    background:#00bcd4;
    color:white;

    font-size:16px;
    cursor:pointer;

    transition:0.3s;
}

button:hover{
    background:#0097a7;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>My Photo Gallery</h1>
<p>Advanced CSS – Flexbox & Grid Gallery</p>
</header>

<!-- ===== GALLERY ===== -->

<div class="gallery" id="gallery"></div>

<!-- ===== LIGHTBOX ===== -->

<div class="lightbox" id="lightbox">
<span class="close" onclick="closeLightbox()">✖</span>

<img id="lightbox-img">

<div class="controls">
<button onclick="prevImage()">Previous</button>
<button onclick="nextImage()">Next</button>
</div>

</div>

<script>

/* ===== LOAD 20 IMAGES AUTOMATICALLY ===== */

const gallery = document.getElementById("gallery");

for(let i=1;i<=20;i++){
    const img = document.createElement("img");
    img.src = `me (${i}).jpg`;
    img.alt = `Photo ${i}`;
    img.onclick = () => openLightbox(i);
    gallery.appendChild(img);
}

/* ===== LIGHTBOX FUNCTIONS ===== */

let currentImage = 1;

function openLightbox(index){
    currentImage = index;
    document.getElementById("lightbox").style.display="flex";
    document.getElementById("lightbox-img").src = `me (${currentImage}).jpg`;
}

function closeLightbox(){
    document.getElementById("lightbox").style.display="none";
}

function nextImage(){
    currentImage++;
    if(currentImage>20) currentImage=1;
    document.getElementById("lightbox-img").src = `me (${currentImage}).jpg`;
}

function prevImage(){
    currentImage--;
    if(currentImage<1) currentImage=20;
    document.getElementById("lightbox-img").src = `me (${currentImage}).jpg`;
}

/* CLICK OUTSIDE IMAGE CLOSES */

document.getElementById("lightbox").addEventListener("click",function(e){
    if(e.target.id==="lightbox"){
        closeLightbox();
    }
});

</script>

</body>
</html>
